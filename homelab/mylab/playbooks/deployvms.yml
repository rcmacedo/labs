---
- name: Deploy lab VMs
  hosts: localhost
  gather_facts: false
  become: yes
  vars:
    vms: "{{ vms_all[target_env] }}"

  roles:
    - homelab.mylab.deploy_vms

  tasks:

    - name: Add each VM to dynamic inventory
      ansible.builtin.add_host:
        name: "{{ item.ip }}"
        groups: vms
        ansible_user: root
        ansible_ssh_common_args: "-o StrictHostKeyChecking=no"
      loop: "{{ vms }}"
      loop_control:
        loop_var: item

- name: Registering hosts to CDN
  hosts: vms
  gather_facts: false
  become: yes
  vars:
    ansible_python_interpreter: /usr/bin/python3.9
    aap_ssh_public_key: "{{ lookup('ansible.builtin.file', lookup('ansible.builtin.env', 'HOME') + '/.ssh/id_rsa.pub') }}"
  vars_files:
    - ../roles/deploy_vms/vars/main.yml

  tasks:

    - name: Wait until VM SSH is ready
      ansible.builtin.wait_for_connection:
        delay: 20
        timeout: 10

    - name: Registering as user {{ registry_user }}.
      community.general.redhat_subscription:
        state: present
        username: "{{ registry_user }}"
        password: "{{ registry_pass }}"

    - name: Enable RHEL repositories required for containerized AAP dependencies
      community.general.rhsm_repository:
        name:
          - rhel-9-for-x86_64-appstream-rpms
          - rhel-9-for-x86_64-baseos-rpms
        state: enabled
      become: yes
      when: target_env == 'aap'

    - name: Create AAP installation user
      ansible.builtin.user:
        name: "{{ aap_install_user }}"
        groups: wheel
        append: true
        create_home: true
        state: present
      become: yes
      when: target_env == 'aap'

    - name: Allow AAP installation user passwordless sudo
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/{{ aap_install_user }}"
        content: "{{ aap_install_user }} ALL=(ALL) NOPASSWD: ALL\n"
        mode: "0440"
        validate: /usr/sbin/visudo -cf %s
      become: yes
      when: target_env == 'aap'

    - name: Add SSH public key for AAP installation user
      ansible.builtin.authorized_key:
        user: "{{ aap_install_user }}"
        state: present
        key: "{{ aap_ssh_public_key }}"
      become: yes
      when: target_env == 'aap'
