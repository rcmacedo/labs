---
- name: Ensure AAP setup base directory exists
  ansible.builtin.file:
    path: "{{ aap_setup_dest }}"
    state: directory
    mode: "0755"
  become: false

- name: Ensure AAP installer Python virtual environment exists
  ansible.builtin.command:
    cmd: python3 -m venv {{ aap_installer_venv }}
    creates: "{{ aap_installer_venv }}/bin/python"
  become: false

- name: Install supported ansible-core version for AAP installer
  ansible.builtin.pip:
    name: "{{ aap_ansible_core_spec }}"
    virtualenv: "{{ aap_installer_venv }}"
    state: present
  become: false

- name: Extract AAP 2.7 containerized setup bundle
  ansible.builtin.unarchive:
    src: "files/{{ aap_setup_tarball }}"
    dest: "{{ aap_setup_dest }}"
    remote_src: false
    extra_opts: [--overwrite]
    creates: "{{ aap_setup_install_dir }}/bundle"
  become: false

- name: Generate dynamic AAP inventory
  ansible.builtin.template:
    src: inventory.j2
    dest: "{{ aap_setup_install_dir }}/inventory"
    mode: "0644"
  become: false

- name: Installing AAP 2.7 (containerized)
  ansible.builtin.command:
    argv:
      - "{{ aap_installer_venv }}/bin/ansible-playbook"
      - -i
      - inventory
      - ansible.containerized_installer.install
    chdir: "{{ aap_setup_install_dir }}"
  environment:
    PYTHONUNBUFFERED: "1"
    ANSIBLE_FORCE_COLOR: "True"
  async: "{{ aap_install_async_timeout }}"
  poll: 0
  become: false

- name: Monitor the installation process
  ansible.builtin.debug:
    msg: >-
      TO MONITOR THE INSTALLATION PROCESS, RUN ->
      tail -f {{ aap_setup_install_dir }}/aap_install.log
      Gateway URL after completion:
      https://{{ vms_all.aap | selectattr('role', 'equalto', 'automationgateway') | map(attribute='name') | first }}.{{ domain }}:443
