# SPDX-License-Identifier: MIT-0
---
# vars file for deploy_vms
# Path to the base qcow2 image (must exist already)
rhel9_image: "/home/rmacedo/isos/rhel-9.8-x86_64-kvm.qcow2"

# Directory where VM disks will be created
vm_storage_path: "/var/lib/libvirt/images"

# Vms root password
root_password: "redhat"

# Vms Domain
domain: lab.example

# Network variables
dns_server: "192.168.124.1"
network_gateway: "192.168.124.1"
network_name: external

# AAP password
aap_password: redhat

# AAP 2.7 disconnected bundle
aap_setup_tarball: "ansible-automation-platform-containerized-setup-bundle-2.7-4-x86_64.tar.gz"
aap_setup_dest: "{{ ansible_env.HOME }}/aap"
aap_setup_install_dir: "{{ aap_setup_dest }}/{{ aap_setup_tarball | regex_replace('\\.tar\\.gz$', '') }}"
postgresql_admin_username: postgres

# Registry variables (RHSM subscription on VMs; not used in AAP inventory)
registry_user: rcmacedo
registry_pass: 01gh@Red01

vms_all:
  aap:
    - name: "aapgateway"
      role: "automationgateway"
      ip: "192.168.124.101"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aapcontroller"
      role: "automationcontroller"
      ip: "192.168.124.102"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aapexec"
      role: "execution_nodes"
      ip: "192.168.124.103"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aapdb"
      role: "database"
      ip: "192.168.124.104"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aapeda"
      role: "automationeda"
      ip: "192.168.124.105"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aaphub"
      role: "automationhub"
      ip: "192.168.124.106"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 20, suffix: root }

    - name: "aapmetrics"
      role: "automationmetrics"
      ip: "192.168.124.107"
      vcpu: 2
      mem: 8192
      disks:
        - { size: 40, suffix: root }
  ocp:
    - { name: "master1", ip: "192.168.124.201", vcpu: 2, mem: 8192, disk_size: 20 }
    - { name: "master2", ip: "192.168.124.202", vcpu: 2, mem: 8192, disk_size: 20 }
    - { name: "master3", ip: "192.168.124.203", vcpu: 2, mem: 8192, disk_size: 20 }
    - { name: "worker1", ip: "192.168.124.204", vcpu: 4, mem: 12288, disk_size: 20 }
    - { name: "worker2", ip: "192.168.124.205", vcpu: 4, mem: 12288, disk_size: 20 }
    - { name: "worker3", ip: "192.168.124.206", vcpu: 4, mem: 12288, disk_size: 20 }
